version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: oak_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: oak_hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: oak_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: