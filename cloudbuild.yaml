steps:
  # 1. Build Docker image with short SHA and latest tags
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push commit-tagged image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-commit-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA'

  # 3. Push latest-tagged image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-latest-image'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest'

  # 4. Deploy automatically to Google Cloud Run (us-central1)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '$_SERVICE_NAME'
      - '--image=gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/$_IMAGE_NAME:latest'

substitutions:
  _SERVICE_NAME: 'oak-hims-staging1'
  _REGION: 'us-central1'
  _IMAGE_NAME: 'oak-hims-staging1'

options:
  logging: CLOUD_LOGGING_ONLY